<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<!--
			A design_themes seed ("Retro Arcade") ezt a három betűtípust várja el
			(docs/architecture/DATA_MODEL.md 8. szakasz). Statikusan betöltve gyors
			első betöltéshez (nincs villanás alapértelmezett betűtípusra); a
			src/lib/theme/tokens.ts loadThemeFonts()-a ugyanezt dinamikusan is
			megteszi minden design_tokens-ben szereplő betűtípusra, így egy admin
			által felvitt új téma más betűtípussal is helyesen töltődik be.
		-->
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
		<link
			rel="stylesheet"
			href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Press+Start+2P&family=Silkscreen:wght@400;700&display=swap"
		/>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
