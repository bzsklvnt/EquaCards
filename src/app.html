<!doctype html>
<html lang="hu">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<!--
			Overscroll/rubber-band villanás elleni védelem: minden oldal saját
			.cabinet gyökere dinamikus style={themeCss}-ből kapja a hátterét
			(var(--cabinet)), de a <html>/<body> maga sosem — trackpad "bounce"
			scroll-nál vagy rövid tartalomnál emiatt átvillanhat a böngésző
			alapértelmezett fehér háttere. Statikus érték, a "Letisztult"
			alaptéma háttérszíne (nem var(), mert az csak lejjebb, a .cabinet
			elemen van definiálva, a <body> nem örökölhetné felfelé).
		-->
		<style>
			html,
			body {
				background: #f6f3ec;
				min-height: 100%;
			}
			/* Élő tesztből: a böngésző alapértelmezett 8px-es body margója miatt
			   minden min-height: 100vh gyökerű felület (host, TV, play)
			   görgethetővé vált, akkor is, ha a tartalom elfért volna. */
			body {
				margin: 0;
			}
			*,
			*::before,
			*::after {
				box-sizing: border-box;
			}
		</style>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
